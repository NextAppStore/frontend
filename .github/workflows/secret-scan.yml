name: Secret Scan

# Pre-merge gate for accidentally committed secrets (tokens, SSH keys,
# OpenStack application credentials, .env files). Runs on every PR and on
# push to main.
#
# Übernommen aus dem deployment-Repo, wo derselbe Scan schon läuft. Bis
# hierher war das Frontend das einzige Code-Repo ohne Secret-Gate —
# obwohl es .env-Dateien und Keycloak-Konfiguration berührt.
#
# Nutzt die gitleaks-CLI direkt: die upstream gitleaks-action verlangt für
# Organisations-Repos eine kostenpflichtige Lizenz, das Binary ist MIT.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: "🔒 Gitleaks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit gitleaks alle Commits des PR prüfen kann
          # (bzw. ganz main beim Push).
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Zwei-Pass-Muster: erst das blockierende Gate, dann der SARIF-Emit,
      # damit auch ignorierte Findings im Security-Tab sichtbar werden.
      - name: Gitleaks scan (gate)
        run: |
          gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Gitleaks scan (SARIF for Security tab)
        if: always()
        run: |
          gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 0

      - name: Upload gitleaks results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
